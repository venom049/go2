# Joint-speed/position refinement of the torque1000 candidate. Opt in explicitly.
# These are tuning starting points, not proof of zero real-robot violations.
# Physical velocity dynamics remain 30 rad/s; measured acceptance is 13 rad/s.
max_iterations: 1000
terrain:
  initial_level: 1
commands:
  start_forward_min: 0.35
  start_forward_max: 0.5
  forward_min: 0.45
  forward_max: 0.65
  speed_ramp_updates: 300
torque:
  enabled: true
  soft_ratio: 0.8
  startup_seconds: 2.0
  startup_multiplier: 2.0
rewards:
  torque_margin: -2.0
  torque_excess: -20.0
  tracking_lin_vel: 2.0
  forward_progress: 0.8
  action_rate: -0.02
  action_smoothness: -0.01
  roll_orientation: -3.0
  roll_rate: -0.25
  lateral_velocity: -0.4
  orientation: -0.05
  ang_vel_xy: -0.1
  joint_deviation: -0.03
  hip_deviation: -0.1
  hip_abduction: -3.0
  feet_lateral: -40.0
  joint_vel: -0.0005
  joint_limits: -2.0
  joint_power: -3.0e-05
  undesired_contacts: -1.0
  foot_slip: -0.6
  foot_clearance: -0.5
  feet_air_time: 0.2
  feet_stumble: -0.5
  velocity_margin: -2.0
  velocity_excess: -20.0
  position_margin: -2.0
  position_excess: -20.0
  target_position_excess: -20.0
  tracking_error: -5.0
targets:
  foot_clearance: 0.1
  air_time: 0.12
  max_air_time: 0.4
  hip_abduction_max: 0.22
  feet_lateral_min: 0.12
  feet_lateral_max: 0.205
  feet_lateral_inner_weight: 2.0
training:
  learning_rate: 0.0001
  min_learning_rate: 1.0e-05
  max_learning_rate: 0.001
  entropy_coef: 0.001
  init_noise_std: 0.1
  min_noise_std: 0.05
  max_noise_std: 0.25
  action_mean_penalty_coef: 0.01
joint_constraints:
  enabled: true
  velocity_limit: 13.0
  velocity_soft_ratio: 0.8
  position_soft_ratio: 0.9
  tracking_error_limit: 0.9
  tracking_soft_ratio: 0.8
  startup_seconds: 2.0
  startup_multiplier: 2.0
  terminate_on_violation: true
