# Lateral posture refinement of our own natural-gait checkpoint.
# Merge with stairs.yaml; the earlier natural-gait config stays unchanged.
# Starting values to validate in simulation, not a proven sim-to-real controller.
max_iterations: 400
terrain:
  initial_level: 1
commands:
  forward_min: 0.3
  forward_max: 0.5
rewards:
  action_rate: -0.02
  action_smoothness: -0.01
  roll_orientation: -1.0
  orientation: -0.05
  ang_vel_xy: -0.10
  joint_deviation: -0.03
  hip_deviation: -0.10
  hip_abduction: -2.0
  feet_lateral: -30.0
  joint_vel: -0.0005
  joint_limits: -2.0
  joint_power: -0.00003
  undesired_contacts: -1.0
  foot_slip: -0.25
  foot_clearance: -0.5
  feet_air_time: 0.2
  feet_stumble: -0.5
targets:
  foot_clearance: 0.10
  air_time: 0.12
  max_air_time: 0.40
  hip_abduction_max: 0.30
  feet_lateral_min: 0.10
  feet_lateral_max: 0.22
training:
  learning_rate: 0.0003
  min_learning_rate: 0.00001
  max_learning_rate: 0.001
  entropy_coef: 0.001
  init_noise_std: 0.45
  min_noise_std: 0.10
  max_noise_std: 0.80
  action_mean_penalty_coef: 0.01
