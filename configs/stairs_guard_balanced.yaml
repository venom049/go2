# Retrain from torque1000 with balanced existing real-controller guard costs.
# Bounded penalties reduce reward domination risk; evaluation still decides success.
# Physical dynamics, raw audits and all real-controller guards remain unchanged.
max_iterations: 1000
terrain:
  initial_level: 1
commands:
  start_forward_min: 0.35
  start_forward_max: 0.50
  forward_min: 0.45
  forward_max: 0.65
  speed_ramp_updates: 300
torque:
  enabled: true
  soft_ratio: 0.8
  startup_seconds: 2.0
  startup_multiplier: 2.0
rewards:
  guard_balance: -1.0
  torque_margin: 0.0
  torque_excess: 0.0
  tracking_lin_vel: 2.0
  forward_progress: 0.8
  action_rate: -0.02
  action_smoothness: -0.01
  roll_orientation: -3.0
  roll_rate: -0.25
  lateral_velocity: -0.4
  orientation: -0.05
  ang_vel_xy: -0.10
  joint_deviation: 0.0
  hip_deviation: 0.0
  hip_abduction: 0.0
  feet_lateral: -40.0
  joint_vel: 0.0
  joint_limits: 0.0
  joint_power: -0.00003
  undesired_contacts: -1.0
  foot_slip: -0.6
  foot_clearance: -0.5
  feet_air_time: 0.2
  feet_stumble: -0.5
  velocity_margin: 0.0
  velocity_excess: 0.0
  position_margin: 0.0
  position_excess: 0.0
  target_position_excess: 0.0
  tracking_error: 0.0
targets:
  foot_clearance: 0.10
  air_time: 0.12
  max_air_time: 0.40
  hip_abduction_max: 0.22
  feet_lateral_min: 0.12
  feet_lateral_max: 0.205
  feet_lateral_inner_weight: 2.0
training:
  learning_rate: 0.0001
  min_learning_rate: 0.00001
  max_learning_rate: 0.001
  entropy_coef: 0.001
  init_noise_std: 0.10
  min_noise_std: 0.05
  max_noise_std: 0.25
  action_mean_penalty_coef: 0.01
joint_constraints:
  enabled: true
  velocity_limit: 13.0
  velocity_soft_ratio: 0.9
  position_soft_ratio: 0.9
  tracking_error_limit: 0.9
  tracking_soft_ratio: 0.8
  startup_seconds: 2.0
  startup_multiplier: 1.0
  # Do not end learning at a guard violation; retain terminal substeps in audits.
  # Simulation fall/contact/timeout terminations still apply.
  terminate_on_violation: false
guard_balance:
  enabled: true
  initial_scale: 0.2
  ramp_updates: 300
  velocity_soft_ratio: 0.9  # margin begins at 11.7 rad/s, stop bound remains 13
  torque_soft_ratio: 0.85
  tracking_soft_ratio: 0.85  # margin begins at 0.765 rad, stop bound is 0.9
  position_overshoot_scale_rad: 0.10
  target_position_overshoot_scale_rad: 0.15
  # Separate monotone soft caps sum to 3 reward units/s at full ramp.
  budget_velocity: 1.25
  budget_torque: 1.0
  budget_tracking: 0.35
  budget_target_position: 0.25
  budget_position: 0.15
